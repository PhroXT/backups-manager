services:

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: backups-manager-minio

    ports:
      - "9000:9000"
      - "9001:9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    volumes:
      - ./data/minio:/data

    command: server /data --console-address ":9001"


  backup-tools:
    build:
      context: ./docker/backup

    container_name: backups-manager-tools
    
    user: "${BACKUP_UID}:${BACKUP_GID}"
    
    volumes:
      - ./storage:/backup
  
  redis:
    image: redis:7-alpine
    container_name: backups-manager-redis
    ports:
      - "6379:6379"