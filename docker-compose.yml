services:

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: backups-manager-minio

    ports:
      - "9000:9000"
      - "9001:9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    volumes:
      - ./data/minio:/data

    command: server /data --console-address ":9001"

  backup-tools:
    build:
      context: ./docker/backup

    container_name: backups-manager-tools
    
    user: "${BACKUP_UID}:${BACKUP_GID}"
    
    volumes:
      - ./storage:/backup

  redis:
    image: redis:7-alpine
    container_name: backups-manager-redis
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    container_name: backups-manager-postgres

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - ./data/postgres:/var/lib/postgresql/data

    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend

    container_name: backups-manager-backend

    env_file:
      - ./backend/.env

    ports:
      - "3001:3001"
      - "5555:5555"

    depends_on:
      - postgres
      - redis
      - minio

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./storage:/storage

  frontend:
    build:
      context: ./frontend

    container_name: backups-manager-frontend

    env_file:
      - ./frontend/.env.local

    ports:
      - "3000:3000"

    depends_on:
      - backend